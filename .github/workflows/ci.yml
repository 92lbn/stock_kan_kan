name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `postinstall` lance `prisma generate` ; on s'assure que le client existe.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Build de production
        run: npm run build
        env:
          # Secret factice pour le build (aucune connexion base requise au build).
          SESSION_SECRET: ci-build-only-dummy-secret-32chars-minimum
