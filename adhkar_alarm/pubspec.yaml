name: adhkar_alarm
description: >-
  Réveil pour musulmans : l'alarme ne s'arrête que si l'utilisateur récite
  correctement à voix haute les invocations du réveil (Adhkar al-Istiyqadh).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Alarme fiable en arrière-plan ---
  # Réveil exact, foreground service Android, audio même en silencieux,
  # relance après reboot. Gère le FullScreenIntent côté natif.
  alarm: ^5.1.0

  # Notifications + FullScreenIntent (Android) / Critical Alerts (iOS)
  flutter_local_notifications: ^18.0.1

  # --- Reconnaissance vocale on-device ---
  # Utilise le moteur STT natif (SFSpeechRecognizer iOS / SpeechRecognizer
  # Android). Locale ar-SA. Fonctionne hors-ligne si le pack langue arabe
  # est installé sur l'appareil.
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

  # --- Persistance locale ---
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # --- Audio de référence (prononciation) ---
  just_audio: ^0.9.42

  # État
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
